<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="fibers">
      <feTurbulence type="fractalNoise" baseFrequency=".53 .72" numOctaves="3" seed="41"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3.3"/></filter>
    <linearGradient id="fade">
      <stop stop-color="#fff" stop-opacity=".22"/><stop offset=".21" stop-color="#fff"/>
      <stop offset=".76" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <mask id="edge"><rect width="1200" height="800" fill="url(#fade)"/></mask>
    <path id="folds" d="M-22 239 Q95 225 184 264 T333 298 Q376 308 404 343 Q450 412 509 423 T674 463 Q732 482 770 529 T959 645 Q1047 669 1238 651 M184 264 Q218 192 279 155 T390 42 M404 343 Q466 300 552 296 T700 222 Q728 192 817 170 T1009 65 M770 529 Q811 474 884 463 T1042 416 Q1116 388 1227 412 M509 423 Q472 483 480 550 T439 712 L386 822 M959 645 Q985 694 975 757 L990 820"/>
  </defs>
  <rect width="1200" height="800" filter="url(#fibers)" opacity=".34"/>
  <g mask="url(#edge)" fill="none" stroke-linecap="round">
    <use href="#folds" stroke="#59616a" stroke-width="9" opacity=".25" filter="url(#soft)" transform="translate(0 3)"/>
    <use href="#folds" stroke="#fff" stroke-width="8" opacity=".72" filter="url(#soft)" transform="translate(0 -4)"/>
    <use href="#folds" stroke="#6c747a" stroke-width="1.15" opacity=".27"/>
    <use href="#folds" stroke="#fff" stroke-width="1.4" opacity=".65" transform="translate(0 -2)"/>
  </g>
</svg>
