<title>失物宇宙｜漂流檔案</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./mist.css">

<body>
<div class="opening" hidden>

  <dialog id="catalog" aria-labelledby="catalog-title">

    <h2 id="catalog-title">漂流索引</h2>
    <label>名稱、編號或線索 <input type="search"></label>
    <output></output><ul></ul>
  </dialog>
</main>
