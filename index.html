<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="echo-endpoint" content="https://lost-universe-echo.papalulala.workers.dev/">
<meta name="description" content="三件失物在灰白的霧裡漂流。靠近一點，就能讀到它們的故事。">
<title>失物宇宙｜漂流檔案</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./mist.css?v=soft-white">
<link rel="stylesheet" href="./frame.css?v=quiet-objects">
<link rel="stylesheet" href="./layers.css?v=bold-intro">
<link rel="stylesheet" href="./explore.css?v=quiet-objects">
<link rel="preload" href="./title-brush.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="./error-brush.ttf" as="font" type="font/ttf" crossorigin>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./"}}</script>
<link rel="stylesheet" href="./echo.css">
<link rel="stylesheet" href="./ink.css?v=doodle">
<link rel="stylesheet" href="./weather.css">
<script type="module" src="./app.js?v=drift-cycle"></script>
<script type="module" src="./opening.js?v=mist-letter"></script>
</head>
<body>
<div class="opening" hidden>
  <div class="mist" aria-hidden="true"></div>
  <div class="opening-title" aria-hidden="true"><span>失</span><span class="turn"><span class="correct">物</span><span class="wrong">誤</span></span><span>宇宙</span></div>
  <button class="skip">跳過開場</button>
</div>
<main id="frame" aria-label="失物宇宙" data-weather="fog">
  <div class="weather" aria-hidden="true"><div class="weather-fog"></div><div class="weather-rain"></div></div>
  <header class="frame-title">
    <a class="brand" href="./">失物宇宙</a>
    <p class="title-intro">點開一件失物，讀它的故事。<br>循著線索，看看下一件會漂到哪裡。</p>
  </header>
  <div id="objects"></div>
  <p class="frame-hint">拖曳轉動失物，點一下讀它的故事。</p>
  <div class="frame-controls"><button id="drift">漂去遠方</button></div>
  <dialog id="echo" aria-labelledby="echo-title">
    <form method="dialog"><button aria-label="關閉回聲簿">關閉</button></form>
    <h2 id="echo-title">回聲簿</h2>
    <p role="status"></p>
    <ul aria-label="訪客的回聲"></ul>
    <form class="echo-form" hidden>
      <label>這件失物，讓你想起了什麼？<textarea maxlength="280" rows="4" required></textarea></label>
      <small>免登入。送出後，這句話會公開顯示。</small>
      <button type="submit">留下回聲</button>
    </form>
  </dialog>
</main>
</body>
</html>
